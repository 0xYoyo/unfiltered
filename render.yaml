# Render blueprint for the playground deployment (YOY-91, region move YOY-115).
#
# One Docker web service built from the repo-root Dockerfile, auto-deploying
# from main, in Frankfurt. Every secret or environment-specific value lives
# in the `unfiltered-prod` environment group, created and filled over the
# Render API (apps/shopify-app/scripts/render-migrate.mts) and attached to
# the service with `fromGroup` — the service itself declares no per-key
# values, and nothing secret is ever stored in this file or typed into the
# dashboard. The Shopify app record is NOT re-pointed at this service (NG-1)
# — SHOPIFY_APP_URL here only satisfies the app's own startup configuration.
#
# Apply: Render dashboard → Blueprints → New Blueprint Instance → this repo.
# See docs/DEPLOY.md for the env-group model, where each value comes from,
# and the re-creation runbook.

envVarGroups:
  # Declared here so the blueprint owns the attachment; the group already
  # exists in the account with every value set, so applying the blueprint
  # links it rather than prompting. Keys, for reference (values are in
  # Render only; docs/DEPLOY.md says where each one comes from):
  #   DATABASE_URL, GEMINI_API_KEY, SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
  #   SHOPIFY_APP_URL, SCOPES, ADMIN_TOKEN, PLAYGROUND_SEED_STORE_KEY,
  #   PLAYGROUND_SEED_NAME, PLAYGROUND_AI_THROTTLE_PER_MINUTE,
  #   PLAYGROUND_DAILY_AI_CAP, PLAYGROUND_CATALOG_DAILY_AI_CAP.
  # Optional overrides (GEMINI_*_MODEL, GEMINI_EMBEDDING_DIMENSION,
  # GEMINI_INTENT_THINKING_LEVEL, PLAYGROUND_TRUSTED_PROXY_HOPS) are added to
  # the same group from the dashboard when needed; unset means the documented
  # defaults in code.
  - name: unfiltered-prod

services:
  - type: web
    name: unfiltered
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: unfiltered-prod
