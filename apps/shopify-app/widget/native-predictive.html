<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfiltered widget harness — native predictive search</title>
    <style>
      .predictive-search__results {
        position: absolute;
        background: #111;
        color: #fff;
        padding: 1rem;
        min-width: 20rem;
      }
      .predictive-search__results[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Real-theme search markup (YOY-60 AC-4): the dev store's theme wraps
         its search form in a predictive-search custom element that listens
         DIRECTLY on the input — 'input' renders a SUGGESTIONS dropdown over
         anything below it, 'focus' reopens it, and Enter navigates to the
         theme's /search results page by script as well as by form submit.
         The M3 live run proved the widget suppressed none of it; this
         fixture pins the suppression in CI. -->
    <!-- Native mode (YOY-101): `?native=A` opts the widget into theme-native
         rendering, where the SAME fixture must prove the opposite of the
         suppression above — typing and focus reach the theme's predictive
         search untouched (the dropdown renders, its event log fills), the
         owned preview box never mounts, no preview request leaves for the
         proxy, and only Enter/submit are taken over. The theme's own
         /search shell and alternate template answer 404 here (not
         installed): the native view enters bare with fallback cards, which
         is enough to prove the submit tier still runs. -->
    <header>
      <h1>Native predictive store</h1>
      <predictive-search>
        <form action="/search" method="get" role="search">
          <input
            type="search"
            name="q"
            placeholder="Theme search"
            autocomplete="off"
          />
          <button type="submit" aria-label="Search">🔍</button>
        </form>
        <div
          id="PredictiveResults"
          class="predictive-search__results"
          data-testid="native-predictive-results"
          hidden
        ></div>
      </predictive-search>
    </header>
    <main>
      <p>Fake product grid placeholder.</p>
    </main>
    <script>
      // The theme's own component, registered and bound BEFORE the widget
      // initializes — adversarial ordering: the widget may not rely on
      // winning a race to attach listeners first.
      class PredictiveSearch extends HTMLElement {
        connectedCallback() {
          this.input = this.querySelector('input[type="search"]');
          this.results = this.querySelector("[data-testid]");
          // Every event the theme's listeners actually receive, in order —
          // the un-suppressed-events evidence for YOY-101 AC-5.
          window.__themeEvents = [];
          const log = (event) => window.__themeEvents.push(event.type + ":" + (event.key ?? ""));
          this.input.addEventListener("input", (event) => {
            log(event);
            this.render();
          });
          this.input.addEventListener("focus", (event) => {
            log(event);
            this.render();
          });
          this.input.addEventListener("keydown", (event) => {
            log(event);
            if (event.key === "Enter") {
              // Some themes navigate by script rather than form submit.
              window.location.assign(
                "/search?q=" + encodeURIComponent(this.input.value),
              );
            }
          });
        }
        render() {
          if (this.input.value === "") {
            this.results.hidden = true;
            return;
          }
          this.results.textContent =
            "SUGGESTIONS: " + this.input.value + " · stock · price";
          this.results.hidden = false;
        }
      }
      customElements.define("predictive-search", PredictiveSearch);
    </script>
    <script type="module">
      import { init } from "/src/main.ts";

      // Contract-shaped stub endpoints, GET transport (YOY-60), matching
      // index.html's stub shape; `?fixture=error` drives the widget inert
      // so the test can prove native predictive search comes back.
      const params = new URLSearchParams(window.location.search);
      const fixture = params.get("fixture") ?? "results";

      window.__searchRequests = [];
      const realFetch = window.fetch.bind(window);
      window.fetch = (input, requestInit) => {
        const url = typeof input === "string" ? input : input.url;
        if (url.startsWith("/apps/unfiltered/search")) {
          const parsed = new URL(url, window.location.origin);
          window.__searchRequests.push({
            query: parsed.searchParams.get("query"),
            mode: parsed.searchParams.get("mode"),
          });
          if (fixture === "error") {
            return Promise.resolve(new Response(null, { status: 500 }));
          }
          return Promise.resolve(
            new Response(
              JSON.stringify({
                searchId: "native-predictive-search-1",
                route: "classic",
                degraded: false,
                results: [
                  {
                    productId: "gid://shopify/Product/1",
                    title: "Nike Air 90",
                    url: "/products/nike-air-90",
                    imageUrl: null,
                    priceMin: 100,
                    priceMax: 100,
                    currencyCode: "ILS",
                    available: true,
                  },
                ],
                chips: [],
              }),
              { headers: { "Content-Type": "application/json" } },
            ),
          );
        }
        if (url.startsWith("/apps/unfiltered/click")) {
          return Promise.resolve(new Response(null, { status: 204 }));
        }
        const parsed = new URL(url, window.location.origin);
        if (
          parsed.pathname === "/search" ||
          (parsed.pathname.startsWith("/products/") && parsed.searchParams.has("view"))
        ) {
          // No search shell, no alternate template on this fixture.
          return Promise.resolve(new Response("Not found", { status: 404 }));
        }
        return realFetch(input, requestInit);
      };

      const native = params.get("native");
      init({
        locale: params.get("locale") ?? "en",
        storeId: "harness.myshopify.com",
        debounceMs: 50,
        nativeRender:
          native === "A" || native === "B" ? { variant: native } : undefined,
      });
    </script>
  </body>
</html>
