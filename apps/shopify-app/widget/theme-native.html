<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfiltered widget harness — theme-native rendering</title>
    <link rel="stylesheet" href="/harness/theme-card.css" />
  </head>
  <body>
    <!-- A Dawn-shaped fake storefront (YOY-70): the theme's own product
         grid and card markup (the selectors the native-render config
         targets), a standard search form, and stubs for the app proxy AND
         for Shopify's alternate-template URL
         `<product url>?view=unfiltered-card`, which answers with the
         same Dawn-shaped card for the requested product. Variant B harvests
         THIS page (its first card is the clone template); Variant A fetches
         the stubbed alternate template per result. No Shopify, no network. -->
    <!-- Full-page mirror (YOY-100): the fetch stub also answers the theme's
         search page, `/search?q=*&type=product`, with a Dawn-shaped
         search-results page (header + main: `template-search` heading,
         the template's own search form, the "N results found for “*”"
         status line, a facets bar and pagination to strip, and the
         theme's `ul.product-grid` holding the theme's OWN hits, which must
         never survive into the results view). `?shell=missing` makes that
         fetch 404 (the bare fallback); `?locale=he` serves the Hebrew
         wording so the count rewrite is proven mid-sentence. The shell's
         page-1 pagination item is Dawn's REAL current-page markup (YOY-96
         AC-8): a disabled, href-less, non-`link` anchor; only the other
         pages carry `link` and an href. -->
    <!-- Multi-input storefront (YOY-99): `?multi=1` adds a Dawn-shaped
         header search modal — `<details-modal><details>` with a page-dim
         overlay and a body scroll lock while open — beside the in-page
         search form below, and `?lazyInput=1` mounts a third search input
         after the widget has initialised (a lazily rendered header). All
         of them must be taken over identically; a takeover submit must
         leave the modal closed and the dim gone. -->
    <template id="header-search-modal">
      <style>
        .header__search details[open] .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
        }
        .header__search details[open] .search-modal__content {
          position: relative;
          padding: 16px;
          background: #fff;
        }
        .header__search details:not([open]) .search-modal {
          display: none;
        }
        body.overflow-hidden-header {
          overflow: hidden;
        }
      </style>
      <details-modal class="header__search">
        <details data-section="header">
          <summary aria-label="Search" data-testid="header-search-summary">
            Search
          </summary>
          <div class="search-modal modal__content" role="dialog" aria-modal="true">
            <div class="modal-overlay" data-testid="header-search-overlay"></div>
            <div class="search-modal__content">
              <form action="/search" method="get" role="search">
                <input
                  type="search"
                  name="q"
                  id="Search-In-Modal"
                  placeholder="Theme search"
                />
                <button type="submit">Search</button>
              </form>
            </div>
          </div>
        </details>
      </details-modal>
    </template>
    <header class="header">
      <a href="/theme-native.html">Harness store</a>
      <form action="/search" method="get" role="search">
        <input type="search" name="q" id="Search-In-Page" placeholder="Theme search" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main id="MainContent" class="page-width">
      <h1>Featured</h1>
      <ul
        class="grid product-grid grid--2-col-tablet-down grid--4-col-desktop"
        role="list"
        data-testid="theme-grid"
      >
        <!-- The harvested card (Variant B's clone template) carries the
             inline-script vectors a theme or app block might: an `onclick`
             on the wrapper, an `onerror` on the image, a hidden
             `javascript:` link. The ORIGIN keeps them; every clone must not
             (YOY-96 AC-1). -->
        <li class="grid__item">
          <div
            class="card-wrapper product-card-wrapper underline-links-hover"
            onclick="window.__hostileHarvestClicked = true"
          >
            <div class="card card--standard card--media" style="--ratio-percent: 125.0%;">
              <div class="card__inner color-background-2 gradient ratio" style="--ratio-percent: 125.0%;">
                <div class="card__media">
                  <div class="media media--transparent media--hover-effect">
                    <img
                      srcset="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'%3E%3Crect width='4' height='5' fill='%23b7c9d6'/%3E%3C/svg%3E 165w"
                      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'%3E%3Crect width='4' height='5' fill='%23b7c9d6'/%3E%3C/svg%3E"
                      alt="Harvest Source Tee"
                      width="400"
                      height="500"
                      onerror="window.__hostileHarvestImageError = true"
                    />
                  </div>
                </div>
              </div>
              <div class="card__content">
                <div class="card__information">
                  <h3 class="card__heading h5" id="title--1001">
                    <a
                      href="/products/harvest-source-tee"
                      id="CardLink--1001"
                      class="full-unstyled-link"
                      aria-labelledby="CardLink--1001 Badge--1001"
                    >Harvest Source Tee</a>
                  </h3>
                  <div class="card-information">
                    <div class="price">
                      <div class="price__container">
                        <div class="price__regular">
                          <span class="visually-hidden">Regular price</span>
                          <span class="price-item price-item--regular">₪ 80</span>
                        </div>
                        <div class="price__sale">
                          <span><s class="price-item price-item--regular">₪ 120</s></span>
                          <span class="price-item price-item--sale price-item--last">₪ 80</span>
                        </div>
                        <small class="unit-price caption hidden"><span></span></small>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="card__badge bottom left" id="Badge--1001"></div>
              </div>
            </div>
            <a href="javascript:void(0)" data-hostile-link hidden>Hostile</a>
          </div>
        </li>
        <li class="grid__item">
          <div class="card-wrapper product-card-wrapper underline-links-hover">
            <div class="card card--standard card--media" style="--ratio-percent: 125.0%;">
              <div class="card__inner color-background-2 gradient ratio" style="--ratio-percent: 125.0%;">
                <div class="card__media">
                  <div class="media media--transparent media--hover-effect">
                    <img
                      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'%3E%3Crect width='4' height='5' fill='%23d6c9b7'/%3E%3C/svg%3E"
                      alt="Second Theme Card"
                      width="400"
                      height="500"
                    />
                  </div>
                </div>
              </div>
              <div class="card__content">
                <div class="card__information">
                  <h3 class="card__heading h5" id="title--1002">
                    <a href="/products/second-theme-card" id="CardLink--1002" class="full-unstyled-link">Second Theme Card</a>
                  </h3>
                  <div class="card-information">
                    <div class="price">
                      <div class="price__container">
                        <div class="price__regular">
                          <span class="price-item price-item--regular">₪ 95</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="card__badge bottom left" id="Badge--1002"></div>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </main>
    <script type="module">
      import { init } from "/src/main.ts";

      const params = new URLSearchParams(window.location.search);
      const fixture = params.get("fixture") ?? "results";

      // Dawn's details-modal, reduced to what the takeover touches: open
      // sets `open` on the <details> and locks body scroll with a
      // section-suffixed class; close() reverses both. Closing on outside
      // click / Escape is what a shopper's "stray click" would do — the
      // widget must not need it (YOY-99 AC-2).
      if (params.get("multi") === "1") {
        class DetailsModal extends HTMLElement {
          connectedCallback() {
            this.detailsContainer = this.querySelector("details");
            this.summaryToggle = this.querySelector("summary");
            this.detailsContainer.addEventListener("keyup", (event) => {
              if (event.code?.toUpperCase() === "ESCAPE") this.close();
            });
            this.summaryToggle.addEventListener("click", (event) => {
              event.preventDefault();
              this.isOpen() ? this.close() : this.open();
            });
          }
          isOpen() {
            return this.detailsContainer.hasAttribute("open");
          }
          open() {
            this.detailsContainer.setAttribute("open", true);
            document.body.classList.add(
              `overflow-hidden-${this.detailsContainer.dataset.section}`,
            );
            this.detailsContainer.querySelector("input").focus();
          }
          close() {
            this.detailsContainer.removeAttribute("open");
            document.body.classList.remove(
              `overflow-hidden-${this.detailsContainer.dataset.section}`,
            );
          }
        }
        customElements.define("details-modal", DetailsModal);
        const fragment = document
          .getElementById("header-search-modal")
          .content.cloneNode(true);
        document.querySelector("header.header").prepend(fragment);
      }
      if (params.get("lazyInput") === "1") {
        // Mounted AFTER init below has run (macrotask), like a header that
        // renders its search input lazily.
        setTimeout(() => {
          const form = document.createElement("form");
          form.action = "/search";
          form.method = "get";
          form.setAttribute("role", "search");
          form.setAttribute("data-testid", "lazy-search-form");
          form.innerHTML =
            '<input type="search" name="q" id="Search-Lazy" placeholder="Theme search" /><button type="submit">Search</button>';
          document.getElementById("MainContent").prepend(form);
        }, 300);
      }
      // `template=missing`: the alternate template is not installed on the
      // theme (every ?view= fetch 404s) — the functional-always fallback.
      const templateMissing = params.get("template") === "missing";
      // `shell=missing`: the theme's search page cannot be fetched — the
      // results view falls back to the bare section (origin still hidden).
      const shellMissing = params.get("shell") === "missing";
      const shellLocale = params.get("locale") ?? "en";
      // `countFormat=range`: a theme whose count line carries more than one
      // number (a page window plus the total) — the first digit run is NOT
      // the count, so the mirror must hide the line rather than rewrite it
      // into a wrong statement (YOY-96 AC-3).
      const countFormat = params.get("countFormat") ?? "dawn";
      const shellHtml = (term) => `<!doctype html>
<html lang="${shellLocale}">
<head><meta charset="utf-8"><title>Search: 95 results found for “${term}”</title>
<link rel="stylesheet" href="/harness/theme-card.css"></head>
<body>
<header class="header"><a href="/theme-native.html">Harness store</a>
  <form action="/search" method="get" role="search"><input type="search" name="q" value="${term}" placeholder="Theme search"><button type="submit">Search</button></form>
</header>
<main id="MainContent" class="page-width">
  <section id="shopify-section-template--search__main" class="shopify-section">
    <link rel="stylesheet" href="/harness/theme-card.css">
    <div class="template-search section-template--search__main-padding">
      <div class="template-search__header page-width center">
        <h1 class="h2" data-testid="theme-search-heading" onclick="window.__hostileShellHeadingClicked = true">${
          shellLocale === "he" ? "תוצאות חיפוש" : "Search results"
        }</h1>
        <a href="JavaScript:void(0)" data-testid="theme-hostile-link" hidden>Hostile</a>
        <button type="button" formaction="javascript:void(0)" data-testid="theme-hostile-formaction" hidden>Hostile</button>
        <svg style="display:none" data-testid="theme-hostile-svg"><a xlink:href=" JavaScript:void(0)" data-testid="theme-hostile-xlink"><text>Hostile</text></a></svg>
        <div class="template-search__search">
          <form action="/search" method="get" role="search" class="search">
            <input class="search__input" id="Search-In-Template" type="search" name="q" value="${term}" placeholder="Search">
            <button type="submit">Search</button>
          </form>
        </div>
        <p role="status" data-testid="theme-results-count">${
          countFormat === "range"
            ? `Showing 1–24 of 95 results for “${term}”`
            : shellLocale === "he"
              ? `נמצאו 95 תוצאות עבור “${term}”`
              : `95 results found for “${term}”`
        }</p>
      </div>
      <div class="facets-container">
        <facet-filters-form class="facets"><form class="facets__form">
          <div class="facets__wrapper" data-testid="theme-facets">Filter: Availability, Price</div>
          <div class="facet-filters sorting" data-testid="theme-sorting">Sort by: Relevance</div>
        </form></facet-filters-form>
      </div>
      <div class="product-grid-container" id="ProductGridContainer">
        <div class="template-search__results collection page-width" id="product-grid">
          <div class="loading-overlay gradient" data-testid="theme-loading-overlay"></div>
          <ul class="grid product-grid grid--2-col-tablet-down grid--3-col-desktop" role="list" data-testid="theme-search-grid">
            <li class="grid__item"><div class="card-wrapper product-card-wrapper"><div class="card card--standard"><div class="card__content"><div class="card__information"><h3 class="card__heading h5"><a href="/products/theme-own-hit" class="full-unstyled-link">Theme Own Hit</a></h3></div></div></div></div></li>
          </ul>
          <div class="pagination-wrapper" data-testid="theme-pagination">
            <nav class="pagination" role="navigation" aria-label="Pagination">
              <ul class="pagination__list list-unstyled" role="list">
                <li><a role="link" aria-disabled="true" aria-current="page" class="pagination__item pagination__item--current">1</a></li>
                <li><a href="/search?q=${term}&amp;page=2" class="pagination__item link" aria-label="Page 2">2</a></li>
                <li><a href="/search?q=${term}&amp;page=3" class="pagination__item link" aria-label="Page 3">3</a></li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
    <script>window.__shellScriptRan = true;<\/script>
  </section>
</main>
<footer class="footer">Harness footer</footer>
</body></html>`;

      window.__searchRequests = [];
      window.__altTemplateRequests = [];
      window.__shellRequests = [];

      const svg = (fill) =>
        `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'%3E%3Crect width='4' height='5' fill='%23${fill}'/%3E%3C/svg%3E`;

      const RESULTS = [
        {
          productId: "gid://shopify/Product/1",
          title: "Nike Air 90",
          url: "/products/nike-air-90",
          imageUrl: svg("9fb8a8"),
          priceMin: 100,
          priceMax: 100,
          currencyCode: "ILS",
          available: true,
        },
        {
          productId: "gid://shopify/Product/2",
          title: "Runner Range",
          url: "/products/runner-range",
          imageUrl: null,
          priceMin: 100,
          priceMax: 150,
          currencyCode: "ILS",
          available: true,
        },
        {
          productId: "gid://shopify/Product/3",
          title: "Sold Out Boot",
          url: "/products/sold-out-boot",
          imageUrl: svg("c9a8b8"),
          priceMin: 200,
          priceMax: 200,
          currencyCode: "ILS",
          available: false,
        },
      ];

      const RESULTS_RESPONSE = {
        searchId: "harness-search-1",
        route: "classic",
        degraded: false,
        results: RESULTS,
        chips: [],
      };

      /**
       * The full match set the server now returns (YOY-107): a broad query
       * answers with every match, and the view pages it with the theme's own
       * pagination. `?results=<N>` sizes it; each product is distinguishable
       * so a test can name the exact card it expects on a given page.
       */
      const manyResults = (count) =>
        Array.from({ length: count }, (_, index) => ({
          productId: `gid://shopify/Product/many-${index}`,
          title: `Full Set Dress ${String(index).padStart(2, "0")}`,
          url: `/products/full-set-${index}`,
          imageUrl: null,
          priceMin: 100 + index,
          priceMax: 100 + index,
          currencyCode: "ILS",
          available: true,
        }));

      /**
       * The narrowed subset of that set, for the refinement contract (AC-3):
       * every third product, which must all still be present — somewhere in
       * the paginated set — once the exclusion chip is removed and it widens.
       */
      const narrowedSubset = (count) =>
        manyResults(count).filter((_, index) => index % 3 === 0);

      /**
       * Server-side pages (YOY-146): a request carrying `page` and
       * `pageSize` gets that page of the fixture's whole result order plus
       * `page` and `totalCount`, as the real endpoint answers.
       */
      /**
       * A judged Engine v2 page with matches (YOY-166): the page's last two
       * products are close — labelled "close match" and served in
       * `closeMatches` beside the matched ones.
       * `?fixture=close-divider` selects it; every page splits the same way.
       */
      const closeDivider = (page) => {
        if (page.results.length < 3) {
          return page;
        }
        const split = page.results.length - 2;
        return {
          ...page,
          route: "ai",
          results: page.results.slice(0, split).map((result, index) => ({
            ...result,
            label:
              index === 0 ? { template: "price-near", values: ["420 ILS", "400 ILS"] } : null,
          })),
          closeMatches: page.results.slice(split).map((result) => ({
            ...result,
            label: { template: "close-match", values: [] },
          })),
        };
      };

      const paged = (body, request) => {
        if (request.page === undefined) {
          return body;
        }
        const start = (request.page - 1) * request.pageSize;
        return {
          ...body,
          results: body.results.slice(start, start + request.pageSize),
          page: request.page,
          totalCount: body.results.length,
        };
      };

      // The AI fixture's chips: three plain v2 ones — the size, a price cap
      // with no currency of its own, and an exclusion (Hebrew under
      // `locale=he`, as a Hebrew shopper would type it).
      const AI_LOCALE = new URLSearchParams(window.location.search).get("locale");
      const AI_EXCLUDED = AI_LOCALE === "he" ? "שחור" : "black";
      const AI_CHIPS = [
        { field: "size", value: "M" },
        { field: "priceMax", value: "400" },
        { field: "exclude", value: AI_EXCLUDED },
      ];
      const AI_RESPONSE = {
        searchId: "harness-ai-1",
        route: "ai",
        degraded: false,
        results: RESULTS,
        chips: AI_CHIPS,
      };
      /**
       * A response carrying EXCLUSIONS (YOY-123 AC-4): a colour and a
       * material the shopper ruled out, beside one ordinary chip.
       * `?fixture=ai-negation` selects it. The widget must make these two
       * chips read as exclusions without introducing a hue the theme does
       * not have (W-3), so this is what the Dawn-mirror evidence is taken
       * against.
       */
      const AI_NEGATION_CHIPS = [
        { field: "size", value: "M" },
        { field: "exclude", value: AI_EXCLUDED },
        { field: "exclude", value: AI_LOCALE === "he" ? "צמר" : "wool" },
      ];
      const AI_NEGATION_RESPONSE = {
        ...AI_RESPONSE,
        searchId: "harness-ai-negation-1",
        chips: AI_NEGATION_CHIPS,
      };

      // An AI response with no results: the zero-hit message and its
      // chips, and nothing under a "Close matches" heading.
      const AI_ZERO_HIT_RESPONSE = {
        ...AI_RESPONSE,
        searchId: "harness-ai-zero-1",
        results: [],
      };

      // Engine v2 fixtures (YOY-149): chips of the v2 fields only — a price chip carrying the shopper's number and its
      // ISO currency, the size as typed, availability, and an exclusion
      // carrying the excluded term as typed (Hebrew under `locale=he`, as a
      // Hebrew shopper would type it). `?fixture=budget|exclude|size`
      // selects one. Removal rides `removedChips` (every chip removed in
      // the chain): the answer is the same response minus those chips.
      const V2_LOCALE = new URLSearchParams(window.location.search).get("locale");
      const V2_EXCLUDED = V2_LOCALE === "he" ? "שחור" : "black";
      const V2_CHIPS = {
        budget: [{ field: "priceMax", value: "400", currency: "ILS" }],
        exclude: [
          { field: "priceMax", value: "400", currency: "ILS" },
          { field: "exclude", value: V2_EXCLUDED },
        ],
        size: [
          { field: "size", value: "M" },
          { field: "availability", value: "in stock" },
        ],
        // YOY-150: a refinement chain (`refine`) and a second reading
        // (`two-meanings`). Both answer a `carry` the way the server builds
        // one — the request's `previousQuery` and the query, one per line.
        refine: [{ field: "size", value: "M" }],
        "two-meanings": [],
      };
      const v2Response = (name, results, request) => {
        const removed = request.removedChips ?? [];
        const chips = V2_CHIPS[name].filter(
          (chip) =>
            !removed.some(
              (gone) => gone.field === chip.field && gone.value === chip.value,
            ),
        );
        // The price cap holds while its chip stands; removed, dearer
        // products come back.
        const capped = chips.some((chip) => chip.field === "priceMax");
        return {
          searchId: `harness-v2-${name}-${removed.length}`,
          route: "ai",
          degraded: false,
          results: capped
            ? results.filter((result) => result.priceMin <= 400)
            : results,
          chips,
          ...(name === "refine" || name === "two-meanings"
            ? {
                carry:
                  request.previousQuery === undefined
                    ? request.query
                    : `${request.previousQuery}\n${request.query}`,
              }
            : {}),
          ...(name === "two-meanings"
            ? { otherReading: V2_LOCALE === "he" ? "שמלות כלה" : "Bridal gowns" }
            : {}),
        };
      };
      const chipRemovalResponse = (request) => ({
        ...(fixture === "ai-negation" ? AI_NEGATION_RESPONSE : AI_RESPONSE),
        searchId: "harness-ai-removal-1",
        chips: (fixture === "ai-negation" ? AI_NEGATION_CHIPS : AI_CHIPS).filter(
          (chip) =>
            !request.removedChips.some(
              (gone) => gone.field === chip.field && gone.value === chip.value,
            ),
        ),
        // Same three products (cache reuse) plus one the constraint excluded.
        results: [
          ...AI_RESPONSE.results,
          {
            productId: "gid://shopify/Product/4",
            title: "Unfiltered By Removal",
            url: "/products/unfiltered-by-removal",
            imageUrl: svg("a8c9c9"),
            priceMin: 500,
            priceMax: 500,
            currencyCode: "ILS",
            available: true,
          },
        ],
      });

      // The stubbed alternate template: what Shopify would render for
      // `templates/product.unfiltered-card.liquid` — the theme's card
      // snippet for that product, preceded by the card's stylesheet link
      // (Dawn's snippet emits component-rating.css the same way).
      // Fixture results carry the server-resolved `url` (YOY-87) — the
      // storefront handle is harness-internal, derived from it here only to
      // key the stubbed alternate template.
      const handleOf = (product) =>
        new URL(product.url, window.location.origin).pathname.slice(
          "/products/".length,
        );

      // The stubbed card also carries the inline-script vectors a theme's
      // snippet or an app block might (an `onclick`, an `onerror`, a
      // hidden `javascript:` link): injected as-is they would go live in
      // the shopper's page; the widget must strip them (YOY-96 AC-1).
      const altTemplateHtml = (product) => `
<link href="/harness/theme-card.css" rel="stylesheet" type="text/css" media="all" />
<div class="card-wrapper product-card-wrapper underline-links-hover" data-alt-template="true" onclick="window.__hostileAltClicked = true">
  <div class="card card--standard ${product.imageUrl ? "card--media" : "card--text"}" style="--ratio-percent: 125.0%;">
    <div class="card__inner color-background-2 gradient ratio" style="--ratio-percent: 125.0%;">
      ${
        product.imageUrl
          ? `<div class="card__media"><div class="media media--transparent media--hover-effect"><img src="${product.imageUrl}" alt="${product.title}" width="400" height="500" onerror="window.__hostileAltImageError = true"></div></div>`
          : ""
      }
    </div>
    <div class="card__content">

      /**
       * The label line (YOY-151), as on the overlay harness: one card per
       * label template plus one that misses nothing (`fixture=labels`), a
       * label over its maximum (`label-too-long`), a label wider than its
       * card (`label-overflow`), and the same cards with `labelsPending`,
       * whose labels the labels endpoint answers late (`labels-pending`).
       * Each is a real product here, so its card is the theme's own.
       */
      const LABELS = [
        { template: "price-near", values: ["420 ILS", "400 ILS"] },
        { template: "price-far", values: ["640 ILS", "400 ILS"] },
        { template: "size-missing", values: ["M", "S", "L"] },
        { template: "fact-differs", values: ["linen", "silk"] },
        { template: "close-match", values: [] },
        null,
      ];
      const labelCard = (index, title, price, label, colour) => ({
        productId: `gid://shopify/Product/label-${index}`,
        title,
        url: `/products/label-${index}`,
        imageUrl: svg(colour),
        priceMin: price,
        priceMax: price,
        currencyCode: "ILS",
        available: true,
        label,
      });
      const LABEL_RESULTS = [
        labelCard(1, "Satin Slip Dress", 420, LABELS[0], "d9d4cd"),
        labelCard(2, "Silk Evening Dress", 640, LABELS[1], "cfc9c1"),
        labelCard(3, "Jersey Midi Dress", 245, LABELS[2], "c8c2b8"),
        labelCard(4, "Linen Wrap Dress", 310, LABELS[3], "bdb6ab"),
        labelCard(5, "Cotton Shirt Dress", 290, LABELS[4], "e3ddd3"),
        labelCard(6, "Crepe Shift Dress", 350, LABELS[5], "d2ccc3"),
      ];
      const labelResponse = (searchId, results, extra = {}) => ({
        searchId,
        route: "ai",
        degraded: false,
        results,
        chips: [
          { field: "priceMax", value: "400", currency: "ILS" },
          { field: "size", value: "M" },
        ],
        ...extra,
      });
      const LABEL_FIXTURES = {
        labels: labelResponse("harness-labels-1", LABEL_RESULTS),
        "label-too-long": labelResponse("harness-label-too-long-1", [
          labelCard(7, "Long Label Dress", 310, {
            template: "fact-differs",
            values: ["recycled organic linen blend", "pure mulberry silk"],
          }, "bdb6ab"),
          LABEL_RESULTS[0],
        ]),
        "label-overflow": labelResponse("harness-label-overflow-1", [
          labelCard(8, "Wide Weave Dress", 310, {
            template: "fact-differs",
            values: ["WWWWWWWWWWWW", "MMMMMMMMMMMM"],
          }, "bdb6ab"),
          // A short label beside it, which fits even a phone-width card.
          LABEL_RESULTS[4],
        ]),
        "labels-pending": labelResponse(
          "harness-labels-pending-1",
          LABEL_RESULTS.map((result) => ({ ...result, label: null })),
          { labelsPending: true },
        ),
      };
      // The pending search's late page (YOY-171 AC-1): the judged order,
      // the not-relevant Jersey Midi Dress gone, the close products under
      // the heading, each card with its label.
      const LATE_PAGE = labelResponse(
        "harness-labels-pending-1",
        [LABEL_RESULTS[5], LABEL_RESULTS[1]],
        { closeMatches: [LABEL_RESULTS[3], LABEL_RESULTS[0], LABEL_RESULTS[4]] },
      );
      // How long the labels endpoint holds a pending page's answer.
      const LABELS_DELAY_MS = 600;

          ...RESULTS,
          ...chipRemovalResponse({ removedChips: [] }).results,
          // The full-set fixture's products, so paging renders the theme's

          const delay = Number(params.get("templateDelay") ?? 0);

            setTimeout(
              () =>
                resolve(
                  new Response(body, { headers: { "Content-Type": "text/html" } }),
                ),
              delay,

            query: parsed.searchParams.get("query"),
            sessionId: parsed.searchParams.get("sessionId"),

            searchDelay === 0

            body = AI_NEGATION_RESPONSE;

            searchId: parsed.searchParams.get("searchId"),
            sessionId: parsed.searchParams.get("sessionId"),
            productId: parsed.searchParams.get("productId"),
            position: Number(parsed.searchParams.get("position")),
          });

        storeId: "harness.myshopify.com",
