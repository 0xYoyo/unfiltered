<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfiltered widget harness</title>
  </head>
  <body>
    <!-- A fake storefront: theme-like markup with a standard search form,
         served entirely locally (YOY-43 AC-4, extended by YOY-48 with
         contract-shaped fixtures for the search and click-beacon
         endpoints). -->
    <header>
      <h1>Harness store</h1>
      <form action="/search" method="get" role="search">
        <input type="search" name="q" placeholder="Theme search" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main>
      <p>Fake product grid placeholder.</p>
    </main>
    <script type="module">
      import { init } from "/src/main.ts";

      // Stubbed proxy endpoints (YOY-48): requests to the app-proxy paths
      // resolve locally with contract-shaped payloads, so widget dev and UI
      // tests never need Shopify or the network. `?fixture=` selects the
      // scenario; captured requests are exposed for test assertions —
      // click beacons in sessionStorage, because the click navigates away.
      const params = new URLSearchParams(window.location.search);
      const fixture = params.get("fixture") ?? "results";

      window.__searchRequests = [];

      const PIXEL =
        "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";

      const RESULTS_RESPONSE = {
        searchId: "harness-search-1",
        route: "classic",
        degraded: false,
        results: [
          {
            productId: "gid://shopify/Product/1",
            title: "Nike Air 90",
            handle: "nike-air-90",
            imageUrl: PIXEL,
            priceMin: 100,
            priceMax: 100,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/2",
            title: "Runner Range",
            handle: "runner-range",
            imageUrl: null,
            priceMin: 100,
            priceMax: 150,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/3",
            title: "Sold Out Boot",
            handle: "sold-out-boot",
            imageUrl: PIXEL,
            priceMin: 200,
            priceMax: 200,
            currencyCode: "ILS",
            available: false,
          },
        ],
        chips: [],
        intent: null,
      };

      // AI-path fixtures (YOY-49): an AI response with chips and an echoed
      // intent, its zero-hit variant with close matches, and a degraded
      // classic response — all contract-shaped.
      const AI_INTENT = {
        category: "dress",
        priceMin: null,
        priceMax: 400,
        currency: "ILS",
        colorsInclude: [],
        colorsExclude: ["black"],
        occasion: null,
        size: null,
        availabilityRequired: false,
        softAttributes: ["elegant"],
      };

      const AI_CHIPS = [
        { field: "category", value: "dress" },
        { field: "priceMax", value: "400" },
        { field: "colorsExclude", value: "black" },
      ];

      const AI_RESPONSE = {
        searchId: "harness-ai-1",
        route: "ai",
        degraded: false,
        results: [
          {
            productId: "gid://shopify/Product/11",
            title: "Silk Gown",
            handle: "silk-gown",
            imageUrl: PIXEL,
            priceMin: 350,
            priceMax: 350,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/12",
            title: "Linen Dress",
            handle: "linen-dress",
            imageUrl: null,
            priceMin: 220,
            priceMax: 260,
            currencyCode: "ILS",
            available: true,
          },
        ],
        chips: AI_CHIPS,
        intent: AI_INTENT,
      };

      // Localization fixture (YOY-50 AC-4): every chip field the display
      // maps cover, plus a color outside the canonical list ("chartreuse")
      // that must render exactly as extracted.
      const AI_LOCALIZED_RESPONSE = {
        ...AI_RESPONSE,
        searchId: "harness-ai-localized-1",
        chips: [
          { field: "category", value: "dress" },
          { field: "priceMax", value: "400" },
          { field: "colorsExclude", value: "black" },
          { field: "colorsInclude", value: "chartreuse" },
          { field: "occasion", value: "evening" },
          { field: "availability", value: "true" },
        ],
      };

      const AI_ZERO_HIT_RESPONSE = {
        ...AI_RESPONSE,
        searchId: "harness-ai-zero-1",
        results: [],
        closeMatches: [
          {
            productId: "gid://shopify/Product/21",
            title: "Black Evening Dress",
            handle: "black-evening-dress",
            imageUrl: PIXEL,
            priceMin: 480,
            priceMax: 480,
            currencyCode: "ILS",
            available: true,
          },
        ],
      };

      const DEGRADED_RESPONSE = {
        searchId: "harness-degraded-1",
        route: "classic",
        degraded: true,
        results: RESULTS_RESPONSE.results.slice(0, 1),
        chips: [],
        intent: null,
      };

      const jsonResponse = (body) =>
        new Response(JSON.stringify(body), {
          headers: { "Content-Type": "application/json" },
        });

      // Contract-correct chip-removal echo: chips minus the removed one,
      // the previousIntent echoed back, and a recomputed result set (a
      // product the removed constraint had excluded appears).
      const chipRemovalResponse = (request) => ({
        ...AI_RESPONSE,
        searchId: "harness-ai-removal-1",
        chips: AI_CHIPS.filter(
          (chip) =>
            !(
              chip.field === request.removeChip.field &&
              chip.value === request.removeChip.value
            ),
        ),
        intent: request.previousIntent,
        results: [
          ...AI_RESPONSE.results,
          {
            productId: "gid://shopify/Product/13",
            title: "Unfiltered By Removal",
            handle: "unfiltered-by-removal",
            imageUrl: null,
            priceMin: 500,
            priceMax: 500,
            currencyCode: "ILS",
            available: true,
          },
        ],
      });

      const realFetch = window.fetch.bind(window);
      window.fetch = (input, requestInit) => {
        const url = typeof input === "string" ? input : input.url;
        if (url.startsWith("/apps/unfiltered/search")) {
          const request = JSON.parse(requestInit.body);
          window.__searchRequests.push(request);
          if (fixture === "error") {
            return Promise.resolve(new Response(null, { status: 500 }));
          }
          if (fixture === "timeout") {
            // Never answers, but honors the abort signal the way real fetch
            // does — the widget's timeout depends on it.
            return new Promise((resolve, reject) => {
              requestInit.signal?.addEventListener("abort", () =>
                reject(new DOMException("aborted", "AbortError")),
              );
            });
          }
          let body;
          if (request.removeChip !== undefined) {
            body = chipRemovalResponse(request);
          } else if (fixture === "ai" || fixture === "ai-delayed") {
            body = AI_RESPONSE;
          } else if (fixture === "ai-localized") {
            body = AI_LOCALIZED_RESPONSE;
          } else if (fixture === "ai-zero-hit") {
            body = AI_ZERO_HIT_RESPONSE;
          } else if (fixture === "degraded") {
            body = DEGRADED_RESPONSE;
          } else if (fixture === "empty") {
            body = { ...RESULTS_RESPONSE, results: [] };
          } else {
            body = RESULTS_RESPONSE;
          }
          if (fixture === "delayed" || fixture === "ai-delayed") {
            return new Promise((resolve) =>
              setTimeout(() => resolve(jsonResponse(body)), 500),
            );
          }
          return Promise.resolve(jsonResponse(body));
        }
        if (url.startsWith("/apps/unfiltered/click")) {
          const log = JSON.parse(
            sessionStorage.getItem("harness:clickBeacons") ?? "[]",
          );
          log.push(JSON.parse(requestInit.body));
          sessionStorage.setItem("harness:clickBeacons", JSON.stringify(log));
          if (fixture === "beacon-missing") {
            return Promise.reject(new TypeError("beacon endpoint absent"));
          }
          return Promise.resolve(new Response(null, { status: 204 }));
        }
        return realFetch(input, requestInit);
      };

      init({
        locale: params.get("locale") ?? "en",
        shopDomain: "harness.myshopify.com",
        debounceMs: 50,
        searchTimeoutMs: fixture === "timeout" ? 300 : 5000,
      });
    </script>
  </body>
</html>
