<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfiltered widget harness</title>
  </head>
  <body>
    <!-- A fake storefront: theme-like markup with a standard search form,
         served entirely locally (YOY-43 AC-4, extended by YOY-48 with
         contract-shaped fixtures for the search and click-beacon
         endpoints). -->
    <header>
      <h1>Harness store</h1>
      <form action="/search" method="get" role="search">
        <input type="search" name="q" placeholder="Theme search" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main>
      <p>Fake product grid placeholder.</p>
    </main>
    <script type="module">
      import { init } from "/src/main.ts";

      // Stubbed proxy endpoints (YOY-48): requests to the app-proxy paths
      // resolve locally with contract-shaped payloads, so widget dev and UI
      // tests never need Shopify or the network. `?fixture=` selects the
      // scenario; captured requests are exposed for test assertions —
      // click beacons in sessionStorage, because the click navigates away.
      const params = new URLSearchParams(window.location.search);
      const fixture = params.get("fixture") ?? "results";

      window.__searchRequests = [];
      // slow-then-fast (YOY-61 AC-4): the FIRST search outlives the widget's
      // timeout override; every later one answers instantly — proving an
      // over-timeout search leaves the widget functional for the next query.
      let searchCount = 0;

      const PIXEL =
        "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";

      const RESULTS_RESPONSE = {
        searchId: "harness-search-1",
        route: "classic",
        degraded: false,
        results: [
          {
            productId: "gid://shopify/Product/1",
            title: "Nike Air 90",
            url: "/products/nike-air-90",
            imageUrl: PIXEL,
            priceMin: 100,
            priceMax: 100,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/2",
            title: "Runner Range",
            url: "/products/runner-range",
            imageUrl: null,
            priceMin: 100,
            priceMax: 150,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/3",
            title: "Sold Out Boot",
            url: "/products/sold-out-boot",
            imageUrl: PIXEL,
            priceMin: 200,
            priceMax: 200,
            currencyCode: "ILS",
            available: false,
          },
        ],
        chips: [],
      };

      // AI-path fixtures (YOY-49): an AI response with chips, its zero-hit
      // variant, and a degraded classic response — all contract-shaped. The
      // chips are three plain v2 ones: the size, a price cap with no
      // currency of its own, and an exclusion (Hebrew under `locale=he`).
      const AI_LOCALE = new URLSearchParams(window.location.search).get("locale");
      const AI_CHIPS = [
        { field: "size", value: "M" },
        { field: "priceMax", value: "400" },
        { field: "exclude", value: AI_LOCALE === "he" ? "שחור" : "black" },
      ];

      const AI_RESPONSE = {
        searchId: "harness-ai-1",
        route: "ai",
        degraded: false,
        results: [
          {
            productId: "gid://shopify/Product/11",
            title: "Silk Gown",
            url: "/products/silk-gown",
            imageUrl: PIXEL,
            priceMin: 350,
            priceMax: 350,
            currencyCode: "ILS",
            available: true,
          },
          {
            productId: "gid://shopify/Product/12",
            title: "Linen Dress",
            url: "/products/linen-dress",
            imageUrl: null,
            priceMin: 220,
            priceMax: 260,
            currencyCode: "ILS",
            available: true,
          },
        ],
        chips: AI_CHIPS,
      };

      // An AI response with no results: the zero-hit message and its
      // chips, and nothing under a "Close matches" heading.
      const AI_ZERO_HIT_RESPONSE = {
        ...AI_RESPONSE,
        searchId: "harness-ai-zero-1",
        results: [],
      };

      const DEGRADED_RESPONSE = {
        searchId: "harness-degraded-1",
        route: "classic",
        degraded: true,
        results: RESULTS_RESPONSE.results.slice(0, 1),
        chips: [],
      };

      // Engine v2 fixtures (YOY-149): chips of the v2 fields only — a price chip carrying the shopper's number and its
      // ISO currency, the size as typed, availability, and an exclusion
      // carrying the excluded term as typed (Hebrew under `locale=he`, as a
      // Hebrew shopper would type it). `?fixture=budget|exclude|size`
      // selects one. Removal rides `removedChips` (every chip removed in
      // the chain): the answer is the same response minus those chips.
      const V2_LOCALE = new URLSearchParams(window.location.search).get("locale");
      const V2_EXCLUDED = V2_LOCALE === "he" ? "שחור" : "black";
      const V2_CHIPS = {
        budget: [{ field: "priceMax", value: "400", currency: "ILS" }],
        exclude: [
          { field: "priceMax", value: "400", currency: "ILS" },
          { field: "exclude", value: V2_EXCLUDED },
        ],
        size: [
          { field: "size", value: "M" },
          { field: "availability", value: "in stock" },
        ],
        // YOY-150: a refinement chain (`refine`) and a second reading
        // (`two-meanings`). Both answer a `carry` the way the server builds
        // one — the request's `previousQuery` and the query, one per line.
        refine: [{ field: "size", value: "M" }],
        "two-meanings": [],
      };
      const v2Response = (name, results, request) => {
        const removed = request.removedChips ?? [];
        const chips = V2_CHIPS[name].filter(
          (chip) =>
            !removed.some(
              (gone) => gone.field === chip.field && gone.value === chip.value,
            ),
        );
        // The price cap holds while its chip stands; removed, dearer
        // products come back.
        const capped = chips.some((chip) => chip.field === "priceMax");
        return {
          searchId: `harness-v2-${name}-${removed.length}`,
          route: "ai",
          degraded: false,
          results: capped
            ? results.filter((result) => result.priceMin <= 400)
            : results,
          chips,
          ...(name === "refine" || name === "two-meanings"
            ? {
                carry:
                  request.previousQuery === undefined
                    ? request.query
                    : `${request.previousQuery}\n${request.query}`,
              }
            : {}),
          ...(name === "two-meanings"
            ? { otherReading: V2_LOCALE === "he" ? "שמלות כלה" : "Bridal gowns" }
            : {}),
        };
      };
      const jsonResponse = (body) =>
        new Response(JSON.stringify(body), {
          headers: { "Content-Type": "application/json" },
        });

      /**
       * A large classic result order (YOY-146): `fixture=many&results=<N>`
       * answers N distinguishable products, so a test can name the card it
       * expects at any position of the whole order.
       */
      const manyResults = (count) =>
        Array.from({ length: count }, (_, index) => ({
          productId: `gid://shopify/Product/many-${index}`,
          title: `Many Dress ${String(index).padStart(2, "0")}`,
          url: `/products/many-${index}`,
          imageUrl: null,
          priceMin: 100 + index,
          priceMax: 100 + index,
          currencyCode: "ILS",
          available: true,
        }));

      /**
       * Server-side pages (YOY-146): a request carrying `page` and
       * `pageSize` gets that page of the fixture's whole result order plus
       * `page` and `totalCount`, as the real endpoint answers. A request
       * without them gets the whole set, as before.
       */
      /**
       * A judged Engine v2 page with matches (YOY-166): the page's last two
       * products are close — labelled "close match" and served in
       * `closeMatches` beside the matched ones.
       * `?fixture=close-divider` selects it; every page splits the same way.
       */
      const closeDivider = (page) => {
        if (page.results.length < 3) {
          return page;
        }
        const split = page.results.length - 2;
        return {
          ...page,
          route: "ai",
          results: page.results.slice(0, split).map((result, index) => ({
            ...result,
            label:
              index === 0 ? { template: "price-near", values: ["420 ILS", "400 ILS"] } : null,
          })),
          closeMatches: page.results.slice(split).map((result) => ({
            ...result,
            label: { template: "close-match", values: [] },
          })),
        };
      };

      /**
       * A page as the Jev judge answers it (YOY-157 AC-27): Jev writes no
       * merchant-fact label, so the server groups its other-variant
       * products with its close one. Only the exact product stays in
       * `results`; three other-variant products and one close product,
       * each labelled "close match", are served in `closeMatches`.
       * `?fixture=close-divider-jev` selects it.
       */
      const closeDividerJev = (page) => ({
        ...page,
        route: "ai",
        results: page.results.slice(0, 1).map((result) => ({ ...result, label: null })),
        closeMatches: page.results.slice(1, 5).map((result) => ({
          ...result,
          label: { template: "close-match", values: [] },
        })),
      });

      const paged = (body, request) => {
        if (request.page === undefined) {
          return body;
        }
        const start = (request.page - 1) * request.pageSize;
        return {
          ...body,
          results: body.results.slice(start, start + request.pageSize),
          page: request.page,
          totalCount: body.results.length,
        };
      };

      // Contract-correct chip-removal answer: chips minus every removed one
      // (`removedChips`), and a recomputed result set (a product the
      // removed constraint had excluded appears).
      const chipRemovalResponse = (request) => ({
        ...AI_RESPONSE,
        searchId: "harness-ai-removal-1",
        chips: AI_CHIPS.filter(
          (chip) =>
            !request.removedChips.some(
              (gone) => gone.field === chip.field && gone.value === chip.value,
            ),
        ),
        results: [
          ...AI_RESPONSE.results,
          {
            productId: "gid://shopify/Product/13",
            title: "Unfiltered By Removal",
            url: "/products/unfiltered-by-removal",
            imageUrl: null,
            priceMin: 500,
            priceMax: 500,
            currencyCode: "ILS",
            available: true,
          },
        ],
      });

      /**
       * The label line (YOY-151): an engine v2 response with one card per
       * label template and one that misses nothing (`fixture=labels`), a
       * label over its template's maximum (`label-too-long`), a label
       * under its maximum but wider than its card (`label-overflow`), and
       * the same cards served with `labelsPending` whose labels the labels
       * endpoint answers late (`labels-pending`).
       */
      const LABELS = [
        { template: "price-near", values: ["420 ILS", "400 ILS"] },
        { template: "price-far", values: ["640 ILS", "400 ILS"] },
        { template: "size-missing", values: ["M", "S", "L"] },
        { template: "fact-differs", values: ["linen", "silk"] },
        { template: "close-match", values: [] },
        null,
      ];
      const labelCard = (index, title, price, label) => ({
        productId: `gid://shopify/Product/label-${index}`,
        title,
        url: `/products/label-${index}`,
        imageUrl: PIXEL,
        priceMin: price,
        priceMax: price,
        currencyCode: "ILS",
        available: true,
        label,
      });
      const LABEL_RESULTS = [
        labelCard(1, "Satin Slip Dress", 420, LABELS[0]),
        labelCard(2, "Silk Evening Dress", 640, LABELS[1]),
        labelCard(3, "Jersey Midi Dress", 245, LABELS[2]),
        labelCard(4, "Linen Wrap Dress", 310, LABELS[3]),
        labelCard(5, "Cotton Shirt Dress", 290, LABELS[4]),
        labelCard(6, "Crepe Shift Dress", 350, LABELS[5]),
      ];
      const labelResponse = (searchId, results, extra = {}) => ({
        searchId,
        route: "ai",
        degraded: false,
        results,
        chips: [
          { field: "priceMax", value: "400", currency: "ILS" },
          { field: "size", value: "M" },
        ],
        ...extra,
      });
      const LABEL_FIXTURES = {
        labels: labelResponse("harness-labels-1", LABEL_RESULTS),
        "label-too-long": labelResponse("harness-label-too-long-1", [
          labelCard(7, "Long Label Dress", 310, {
            template: "fact-differs",
            values: ["recycled organic linen blend", "pure mulberry silk"],
          }),
          LABEL_RESULTS[0],
        ]),
        "label-overflow": labelResponse("harness-label-overflow-1", [
          labelCard(8, "Wide Weave Dress", 310, {
            template: "fact-differs",
            values: ["WWWWWWWWWWWW", "MMMMMMMMMMMM"],
          }),
          LABEL_RESULTS[0],
        ]),
        "labels-pending": labelResponse(
          "harness-labels-pending-1",
          LABEL_RESULTS.map((result) => ({ ...result, label: null })),
          { labelsPending: true },
        ),
      };
      // How long the labels endpoint holds a pending page's answer.
      const LABELS_DELAY_MS = 600;
      window.__labelsRequests = [];

      const realFetch = window.fetch.bind(window);
      window.fetch = (input, requestInit) => {
        const url = typeof input === "string" ? input : input.url;
        if (url.startsWith("/apps/unfiltered/search")) {
          // The widget rides GET query params (YOY-60): reconstruct the
          // request object from the URL the way the server's parse layer
          // does, keeping test assertions shape-identical.
          const params = new URL(url, window.location.origin).searchParams;
          const request = {
            query: params.get("query"),
            sessionId: params.get("sessionId"),
          };
          if (params.has("removedChips")) {
            request.removedChips = JSON.parse(params.get("removedChips"));
          }
          if (params.has("previousQuery")) {
            request.previousQuery = params.get("previousQuery");
          }
          if (params.has("mode")) {
            request.mode = params.get("mode");
          }
          if (params.has("page")) {
            request.page = Number(params.get("page"));
            request.pageSize = Number(params.get("pageSize"));
          }
          window.__searchRequests.push(request);
          searchCount += 1;
          if (fixture === "error") {
            return Promise.resolve(new Response(null, { status: 500 }));
          }
          // `failPage=<N>`: that page's request fails (YOY-146 AC-9).
          const failPage = new URLSearchParams(window.location.search).get(
            "failPage",
          );
          if (failPage !== null && request.page === Number(failPage)) {
            return Promise.resolve(new Response(null, { status: 500 }));
          }
          if (fixture === "slow-then-fast" && searchCount === 1) {
            // Outlives the 300ms timeout override but honors the abort
            // signal like real fetch — the widget's timeout depends on it.
            return new Promise((resolve, reject) => {
              requestInit.signal?.addEventListener("abort", () =>
                reject(new DOMException("aborted", "AbortError")),
              );
              setTimeout(() => resolve(jsonResponse(RESULTS_RESPONSE)), 800);
            });
          }
          const stall = () =>
            // Never answers, but honors the abort signal the way real fetch
            // does — the widget's timeout depends on it.
            new Promise((resolve, reject) => {
              requestInit.signal?.addEventListener("abort", () =>
                reject(new DOMException("aborted", "AbortError")),
              );
            });
          if (fixture === "timeout") {
            return stall();
          }
          // YOY-108: the submitted (AI) request outlives its budget while
          // the classic-only rescue answers — `timeout-rescue` serves it,
          // `timeout-rescue-error` fails it so the failure state is the
          // honest answer (AC-2).
          if (
            fixture === "timeout-rescue" ||
            fixture === "timeout-rescue-error"
          ) {
            // The rescue rides `mode=classic` (YOY-96 AC-9); the submitted
            // request (no mode) is the one that stalls.
            if (request.mode !== "classic") {
              return stall();
            }
            if (fixture === "timeout-rescue-error") {
              return Promise.resolve(new Response(null, { status: 500 }));
            }
            return Promise.resolve(jsonResponse(paged(RESULTS_RESPONSE, request)));
          }
          let body;
          if (request.mode === "preview" || request.mode === "classic") {
            // Keystroke previews are classic-only server-side (YOY-68 AC-1),
            // whatever fixture the SUBMIT would hit: `empty` previews stay
            // empty; every other fixture previews the plain classic set.
            // The classic rescue (YOY-96 AC-9) is the same keyword answer.
            body =
              fixture === "empty"
                ? { ...RESULTS_RESPONSE, results: [] }
                : RESULTS_RESPONSE;
          } else if (fixture in V2_CHIPS) {
            body = v2Response(fixture, [
              ...AI_RESPONSE.results,
              {
                productId: "gid://shopify/Product/14",
                title: "Velvet Gown",
                url: "/products/velvet-gown",
                imageUrl: PIXEL,
                priceMin: 620,
                priceMax: 620,
                currencyCode: "ILS",
                available: true,
              },
            ], request);
          } else if (
            request.removedChips !== undefined &&
            (fixture === "ai" || fixture === "ai-delayed" || fixture === "ai-zero-hit")
          ) {
            body = chipRemovalResponse(request);
          } else if (fixture in LABEL_FIXTURES) {
            body = LABEL_FIXTURES[fixture];
          } else if (fixture === "ai" || fixture === "ai-delayed") {
            body = AI_RESPONSE;
          } else if (fixture === "ai-zero-hit") {
            body = AI_ZERO_HIT_RESPONSE;
          } else if (fixture === "degraded") {
            body = DEGRADED_RESPONSE;
          } else if (fixture === "empty") {
            body = { ...RESULTS_RESPONSE, results: [] };
          } else if (
            fixture === "many" ||
            fixture === "close-divider" ||
            fixture === "close-divider-jev"
          ) {
            body = {
              ...RESULTS_RESPONSE,
              searchId: "harness-many-1",
              results: manyResults(
                Number(
                  new URLSearchParams(window.location.search).get("results") ??
                    30,
                ),
              ),
            };
          } else if (fixture === "images") {
            // Sized card images (YOY-169): one Shopify-CDN image, one
            // crawl-sourced image on another host.
            body = {
              ...RESULTS_RESPONSE,
              results: RESULTS_RESPONSE.results.slice(0, 2).map((result, index) => ({
                ...result,
                imageUrl:
                  index === 0
                    ? "https://cdn.shopify.com/s/files/1/0001/files/fixture-dress.jpg?v=1712345678"
                    : "https://images.example.test/products/fixture-shirt.jpg",
              })),
            };
          } else if (fixture === "null-url") {
            // A catalog whose adapter resolved no product links (YOY-87
            // AC-4): every card renders linkless.
            body = {
              ...RESULTS_RESPONSE,
              results: RESULTS_RESPONSE.results.map((result) => ({
                ...result,
                url: null,
              })),
            };
          } else {
            body = RESULTS_RESPONSE;
          }
          body = paged(body, request);
          if (fixture === "close-divider") {
            body = closeDivider(body);
          } else if (fixture === "close-divider-jev") {
            body = closeDividerJev(body);
          }
          if (fixture === "delayed" || fixture === "ai-delayed") {
            return new Promise((resolve) =>
              setTimeout(() => resolve(jsonResponse(body)), 500),
            );
          }
          // `pageDelay=<ms>`: later pages answer slowly, so the quiet
          // loading line is observable (YOY-146 AC-7).
          const pageDelay = Number(
            new URLSearchParams(window.location.search).get("pageDelay") ?? 0,
          );
          if (pageDelay > 0 && (request.page ?? 1) > 1) {
            return new Promise((resolve) =>
              setTimeout(() => resolve(jsonResponse(body)), pageDelay),
            );
          }
          return Promise.resolve(jsonResponse(body));
        }
        if (url.startsWith("/apps/unfiltered/labels")) {
          // The late labels (YOY-151 AC-8): logged, then answered after a
          // hold — the `labels` fixture's labels by product id for the
          // pending search, an empty set for any other.
          const params = new URL(url, window.location.origin).searchParams;
          const request = {
            searchId: params.get("searchId"),
            page: Number(params.get("page")),
          };
          window.__labelsRequests.push(request);
          const labels =
            request.searchId === LABEL_FIXTURES["labels-pending"].searchId
              ? Object.fromEntries(
                  LABEL_RESULTS.map((result) => [result.productId, result.label]),
                )
              : {};
          return new Promise((resolve) =>
            setTimeout(
              () => resolve(jsonResponse({ labels })),
              LABELS_DELAY_MS,
            ),
          );
        }
        if (url.startsWith("/apps/unfiltered/click")) {
          const log = JSON.parse(
            sessionStorage.getItem("harness:clickBeacons") ?? "[]",
          );
          const params = new URL(url, window.location.origin).searchParams;
          log.push({
            searchId: params.get("searchId"),
            sessionId: params.get("sessionId"),
            productId: params.get("productId"),
            position: Number(params.get("position")),
          });
          sessionStorage.setItem("harness:clickBeacons", JSON.stringify(log));
          if (fixture === "beacon-missing") {
            return Promise.reject(new TypeError("beacon endpoint absent"));
          }
          return Promise.resolve(new Response(null, { status: 204 }));
        }
        return realFetch(input, requestInit);
      };

      // Search responses the widget has read (YOY-157 AC-30): a body counts
      // once its json() resolves. The widget applies the response (carry,
      // chips) in the same microtask chain, so a test that waits for this
      // count waits on the response being applied, never on timing.
      window.__searchResponsesRead = 0;
      const stubFetch = window.fetch;
      window.fetch = (input, requestInit) =>
        Promise.resolve(stubFetch(input, requestInit)).then((response) => {
          const url = typeof input === "string" ? input : input.url;
          if (url.startsWith("/apps/unfiltered/search") && response instanceof Response) {
            const read = response.json.bind(response);
            response.json = () =>
              read().then((body) => {
                window.__searchResponsesRead += 1;
                return body;
              });
          }
          return response;
        });

      init({
        locale: params.get("locale") ?? "en",
        storeId: "harness.myshopify.com",
        // `?debounce=` lets tests stretch the debounce far beyond the test
        // timeout, so a search arriving anyway proves the immediate path
        // (YOY-52 AC-14) rather than a fast debounce firing.
        debounceMs: Number(params.get("debounce") ?? 50),
        searchTimeoutMs:
          fixture === "timeout" ||
          fixture === "slow-then-fast" ||
          fixture === "timeout-rescue" ||
          fixture === "timeout-rescue-error"
            ? 300
            : 5000,
        // The classic rescue's own budget (YOY-108 AC-4), short here so a
        // rescue that is meant to fail does so inside the test timeout.
        searchFallbackTimeoutMs: Number(params.get("fallbackTimeout") ?? 300),
      });
    </script>
  </body>
</html>
