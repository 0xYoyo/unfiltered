<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unfiltered widget harness — hostile theme CSS</title>
    <style>
      /* A deliberately hostile theme (YOY-48 AC-7): a broad rule that would
         hide any unprotected widget mount point, plus rules targeting the
         widget's own internal class names. None of it may break the
         overlay, and the widget's styles may not restyle the host elements
         that share those class names. */
      div {
        display: none;
      }
      header,
      form {
        display: block;
      }
      .overlay,
      .grid,
      .card {
        display: none !important;
        border: 0 !important;
      }
      body {
        font-family: Georgia, serif;
        color: rgb(20, 30, 40);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hostile theme store</h1>
      <form action="/search" method="get" role="search">
        <input type="search" name="q" placeholder="Theme search" />
        <button type="submit">Search</button>
      </form>
      <!-- Host element sharing a widget-internal class name: widget CSS
           must not restyle it. -->
      <p class="card" id="host-card">Host element named "card"</p>
    </header>
    <script type="module">
      import { init } from "/src/main.ts";

      const params = new URLSearchParams(window.location.search);
      const jsonResponse = (body) =>
        new Response(JSON.stringify(body), {
          headers: { "Content-Type": "application/json" },
        });

      const realFetch = window.fetch.bind(window);
      window.fetch = (input, requestInit) => {
        const url = typeof input === "string" ? input : input.url;
        if (url.startsWith("/apps/unfiltered/search")) {
          return Promise.resolve(
            jsonResponse({
              searchId: "hostile-search-1",
              route: "classic",
              degraded: false,
              results: [
                {
                  productId: "gid://shopify/Product/1",
                  title: "Nike Air 90",
                  url: "/products/nike-air-90",
                  imageUrl: null,
                  priceMin: 100,
                  priceMax: 100,
                  currencyCode: "ILS",
                  available: true,
                },
              ],
              chips: [],
              intent: null,
            }),
          );
        }
        if (url.startsWith("/apps/unfiltered/click")) {
          return Promise.resolve(new Response(null, { status: 204 }));
        }
        return realFetch(input, requestInit);
      };

      init({
        locale: params.get("locale") ?? "en",
        shopDomain: "harness.myshopify.com",
        debounceMs: 50,
      });
    </script>
  </body>
</html>
