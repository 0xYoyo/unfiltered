# This file stores configurations for your Shopify app.
# client_id is filled in by `shopify app config link`.
client_id = "f1bcfb5169066f87e38a69ef05342498"
name = "unfiltered"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# Storefront app proxy: shopper-facing requests to /apps/unfiltered/* on the
# shop domain are forwarded here with Shopify's proxy signature. Handled by:
# /app/routes/apps.unfiltered.search.tsx
[app_proxy]
url = "https://shopify.dev/apps/unfiltered"
prefix = "apps"
subpath = "unfiltered"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_inventory"

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.products.create.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = ["products/create"]

  # Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = ["products/update"]

  # Handled by: /app/routes/webhooks.products.delete.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = ["products/delete"]

  # Webhooks can have filters
  # Only receive webhooks for product updates with a product price >= 10.00
  # See: https://shopify.dev/docs/apps/build/webhooks/customize/filters
  # [[webhooks.subscriptions]]
  # topics = ["products/update"]
  # uri = "/webhooks/products/update"
  # filter = "variants.price:>=10.00"

  # Mandatory compliance topics
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance

  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
