<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Group Runner Sneaker</title>
  <link rel="canonical" href="https://shop.example/product/group-sneaker">
  <!-- Custom store: a ProductGroup with three variants at 90 / 120 / 150; only
       the middle variant is in stock — the group collapses to one product. -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "ProductGroup",
      "sku": "GRP-SNK",
      "productGroupID": "GRP-SNK",
      "name": "Group Runner Sneaker",
      "url": "https://shop.example/product/group-sneaker",
      "description": "Lightweight runner in three sizes.",
      "brand": { "@type": "Brand", "name": "Group Sport" },
      "category": "Sneakers",
      "hasVariant": [
        { "@type": "Product", "sku": "GRP-SNK-38", "name": "Group Runner Sneaker 38", "image": "https://shop.example/img/group-sneaker-38.jpg",
          "offers": { "@type": "Offer", "price": 90, "priceCurrency": "ILS", "availability": "https://schema.org/OutOfStock" } },
        { "@type": "Product", "sku": "GRP-SNK-40", "name": "Group Runner Sneaker 40",
          "offers": { "@type": "Offer", "price": "120", "priceCurrency": "ILS", "availability": "https://schema.org/InStock" } },
        { "@type": "Product", "sku": "GRP-SNK-42", "name": "Group Runner Sneaker 42",
          "offers": { "@type": "Offer", "price": "150", "priceCurrency": "ILS", "availability": "https://schema.org/OutOfStock" } }
      ]
    }
  ]
  </script>
</head>
<body><h1>Group Runner Sneaker</h1></body>
</html>
