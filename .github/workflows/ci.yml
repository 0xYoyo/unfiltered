name: CI

on:
  pull_request:

jobs:
  # Every job carries an explicit timeout-minutes (YOY-96 AC-18): a wedged
  # runner otherwise holds a PR for GitHub's 360-minute default, invisible to
  # both loops. Values are ~3x each job's steady state from the Actions
  # history at implementation time (gate ~4 min, ui ~3, dist-seam ~2, docker
  # ~3 warm / longer on a cold layer cache), so a stall surfaces as a failed
  # check within the loop's cadence instead of six hours later.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Repo-map drift guard (YOY-75 AC-2): docs/REPO-MAP.md is generated;
      # fails on a stale map, naming the fix command.
      - run: node scripts/repo-map.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Bundle-drift guard (YOY-52 AC-3): the widget's built assets are
      # committed and byte-reproducible; a PR that edits widget/src/ without
      # running build:widget would ship stale assets to themes. Rebuilding
      # here and failing on any diff makes drift impossible to merge.
      - run: npm run build:widget
      - run: git diff --exit-code -- apps/shopify-app/extensions/unfiltered-widget/assets/
      # The playground project (YOY-92 AC-8) drives the BUILT app in fixture
      # mode, not a dev server: SSR lang/dir and the meta tags are what its
      # acceptance criteria are about, and only a real build can prove them.
      - run: npm run build --workspace app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  # Dist-seam guard (YOY-104 AC-3): the app and every test execute the
  # workspace packages' TypeScript source (apps/shopify-app/vite.config.ts and
  # vitest.config.ts alias @unfiltered/* to src), so nothing in the repo runs
  # compiled dist/ any more — but the app↔engine port contract must hold for
  # the built artifact too. This job builds the workspaces and runs the
  # retrieval-path suites WITHOUT the src alias (vitest.dist-seam.config.ts),
  # resolving @unfiltered/* through each package's `exports` → dist/. PR #74's
  # shopDomain → storeId rename would have gone red here and nowhere else.
  dist-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: >-
          npx vitest run --config vitest.dist-seam.config.ts
          apps/shopify-app/app/search/orchestrator.test.ts
          apps/shopify-app/app/search/retrieval-store.test.ts

  # Image-build guard (YOY-91 AC-4): the deployment is a Docker web service
  # built from the repo-root Dockerfile, and Render builds it only after the
  # merge — so without this job a PR that breaks the image (a moved workspace
  # path, a new build step, a dependency the install order cannot satisfy)
  # merges green and takes production down on deploy. Build only: no push, no
  # run, no registry credentials in a pull_request context.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
